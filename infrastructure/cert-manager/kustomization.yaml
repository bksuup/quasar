---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmRepository.yaml
  - helmRelease.yaml

configMapGenerator:
  - name: cert-manager-values
    namespace: cert-manager
    options:
      disableNameSuffixHash: true
    files:
      - values.yaml
