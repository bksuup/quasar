# Traefik
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sync-traefik
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./applications/traefik
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sync-cert-manager
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./applications/cert-manager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
